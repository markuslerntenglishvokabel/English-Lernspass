<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff69b4"><title>Englisch Lernspaß 2.0</title><style>body{font-family:Arial;background:linear-gradient(135deg,#ffd6e7,#dbeafe);padding:15px} .card{background:#fff;border-radius:18px;padding:15px;margin-bottom:15px} button{background:#ff69b4;color:#fff;border:0;padding:8px 12px;border-radius:12px} .correct{color:green;font-weight:bold}.wrong{color:red;font-weight:bold} table{width:100%} th,td{border:1px solid #ccc;padding:5px} table{border-collapse:collapse}</style></head><body><div class=card><h1>🌈 Englisch Lernspaß 2.0</h1><input id=de placeholder=Deutsch><input id=en placeholder=English><button onclick=add()>Hinzufügen</button><button onclick=exp()>Export</button><input type=file id=imp><button onclick=impf()>Import</button><table id=t></table></div><div class=card><button onclick=start()>Prüfung starten</button><div id=q></div><input id=a><button onclick=check()>Prüfen</button><div id=f></div></div><script>let v=JSON.parse(localStorage.v||'[]');let q=[],i=0,s=0;function save(){localStorage.v=JSON.stringify(v);draw()}function add(){if(!de.value||!en.value)return;v.push({g:de.value,e:en.value,c:0,w:0});de.value='';en.value='';save()}function delv(x){v.splice(x,1);save()}function editv(x){let g=prompt('Deutsch',v[x].g);if(g==null)return;let e=prompt('English',v[x].e);if(e==null)return;v[x].g=g;v[x].e=e;save()}function draw(){t.innerHTML='<tr><th>D</th><th>E</th><th>✓</th><th>✗</th><th></th></tr>'+v.map((r,n)=>`<tr><td>${r.g}</td><td>${r.e}</td><td>${r.c}</td><td>${r.w}</td><td><button onclick=editv(${n})>✏️</button><button onclick=delv(${n})>🗑️</button></td></tr>`).join('')}function start(){q=[...v].sort(()=>Math.random()-.5);i=0;s=0;show()}function show(){if(i>=q.length){q.innerHTML='';document.getElementById('q').innerHTML='🏆 '+s+' von '+q.length;return;}document.getElementById('q').innerHTML='<h2>'+q[i].g+'</h2>';f.innerHTML='';a.value='';}function speak(w){speechSynthesis.speak(new SpeechSynthesisUtterance(w));}function check(){let c=q[i].e,u=a.value,res='';for(let x=0;x<c.length;x++){if(u[x]===undefined)res+='<span class=wrong>?</span>';else if(u[x].toLowerCase()==c[x].toLowerCase())res+='<span class=correct>'+c[x]+'</span>';else res+='<span class=wrong>'+c[x]+'</span>';}f.innerHTML=res;let o=v.find(r=>r.g==q[i].g&&r.e==q[i].e);if(u.toLowerCase()==c.toLowerCase()){o.c++;s++;speak(c);f.innerHTML+='<br>Perfect!';}else o.w++;save();i++;setTimeout(show,1500)}function exp(){let b=new Blob([JSON.stringify(v)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vokabeln.json';a.click()}function impf(){let file=document.getElementById('imp').files[0];if(!file)return;let r=new FileReader();r.onload=e=>{v=JSON.parse(e.target.result);save()};r.readAsText(file)}draw();if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}</script></body></html>
